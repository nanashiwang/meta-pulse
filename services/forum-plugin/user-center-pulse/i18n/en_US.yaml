plugin:
  pulse_user_center:
    backend:
      info:
        name:
          other: Meta Pulse User Center
        description:
          other: Keep local Answer accounts and optionally bind a Meta API account for Pulse benefits
      connector:
        name:
          other: Connect Meta API account
      config:
        newapi_base_url:
          title:
            other: new-api Base URL
          description:
            other: HTTPS root URL of the Meta API console used for optional account linking.
        pulse_base_url:
          title:
            other: Meta Pulse Internal Base URL
          description:
            other: Base URL of meta-pulse-api. Only the read-only profile endpoint is called.
        sso_hmac_secret:
          title:
            other: Forum SSO HMAC Secret
          description:
            other: Must match new-api PULSE_FORUM_SSO_SECRET, is only used to verify Login Tickets, and must not be reused as the Pulse profile secret.
        sso_hmac_secret_previous:
          title:
            other: Previous Forum SSO HMAC Secret (rotation)
          description:
            other: Keep the previous secret only during rotation; clear it after every new-api instance and login request has switched.
        pulse_hmac_secret:
          title:
            other: Pulse Service HMAC Secret
          description:
            other: Must match Pulse PULSE_FORUM_HMAC_SECRET, is only used for read-only profile requests, and must not reuse the Forum SSO or settlement secret.
        nonce_redis_url:
          title:
            other: Login Ticket Nonce Redis URL
          description:
            other: Redis URL shared by every Answer instance for browser-bound flows and one-time Login Tickets; linking fails closed when unavailable.
        level_badge_enabled:
          label:
            other: Show Meta Pulse level badges
          title:
            other: Level Badges
          description:
            other: Render the user's Meta Pulse level and lifetime contribution on their profile.
      control_center:
        pulse:
          other: Meta Pulse
        console:
          other: API Console
      branding:
        level:
          other: Level
        contribution:
          other: Contribution
