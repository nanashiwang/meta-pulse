plugin:
  pulse_user_center:
    backend:
      info:
        name:
          other: Meta Pulse User Center
        description:
          other: Delegate forum identity to new-api and render Meta Pulse levels as profile badges
      config:
        newapi_base_url:
          title:
            other: new-api Base URL
          description:
            other: Base URL of the new-api console used for login and sign-up redirects.
        pulse_base_url:
          title:
            other: Meta Pulse Internal Base URL
          description:
            other: Base URL of meta-pulse-api. Only the read-only profile endpoint is called.
        sso_hmac_secret:
          title:
            other: Forum SSO HMAC Secret
          description:
            other: Must match new-api PULSE_FORUM_SSO_SECRET and is only used to verify Login Tickets.
        pulse_hmac_secret:
          title:
            other: Pulse Service HMAC Secret
          description:
            other: Must match Pulse PULSE_SERVICE_HMAC_SECRET and is only used to sign read-only profile requests.
        nonce_redis_url:
          title:
            other: Login Ticket Nonce Redis URL
          description:
            other: Redis URL shared by every Answer instance to atomically consume one-time login tickets; login fails closed when unavailable.
        level_badge_enabled:
          label:
            other: Show Meta Pulse level badges
          title:
            other: Level Badges
          description:
            other: Render the user's Meta Pulse level and lifetime contribution on their profile.
      control_center:
        pulse:
          other: Meta Pulse
        console:
          other: API Console
      branding:
        level:
          other: Level
        contribution:
          other: Contribution
