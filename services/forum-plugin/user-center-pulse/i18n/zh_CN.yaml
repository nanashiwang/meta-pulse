plugin:
  pulse_user_center:
    backend:
      info:
        name:
          other: 元衡用户中心
        description:
          other: 允许 Answer 本地注册，并可选择绑定元衡 API 账号以展示脉冲权益
      connector:
        name:
          other: 绑定元衡 API 账号
      config:
        newapi_base_url:
          title:
            other: new-api 基础地址
          description:
            other: 元衡 API 控制台的 HTTPS 根地址，用于可选账号绑定。
        pulse_base_url:
          title:
            other: Meta Pulse 内部地址
          description:
            other: meta-pulse-api 私网地址，用于等级档案和已认证社区用户的权益请求。
        sso_hmac_secret:
          title:
            other: 论坛 SSO HMAC 密钥
          description:
            other: 与 new-api 的 PULSE_FORUM_SSO_SECRET 相同，仅用于 Login Ticket 验签；不得与 Pulse 档案密钥复用。
        sso_hmac_secret_previous:
          title:
            other: 论坛 SSO 旧 HMAC 密钥（轮换期间）
          description:
            other: 轮换期间临时填写旧密钥；所有 new-api 实例和登录请求切换完成后清空。
        pulse_hmac_secret:
          title:
            other: Pulse 服务 HMAC 密钥
          description:
            other: 与 Pulse 的 PULSE_FORUM_HMAC_SECRET 相同，仅用于签名只读档案请求；不得与 Forum SSO 或结算密钥复用。
        community_bff_hmac_secret:
          title:
            other: 社区 Pulse BFF HMAC 密钥
          description:
            other: 选填。与 Pulse 的 PULSE_COMMUNITY_BFF_HMAC_SECRET 相同，必须独立于 SSO、档案、管理和结算密钥。留空关闭社区权益接口，不影响本地登录。
        admin_hmac_secret:
          title:
            other: Pulse 管理配置 HMAC 密钥
          description:
            other: 选填。首次配对时填写 Pulse 的 PULSE_ADMIN_HMAC_SECRET，仅供社区管理员配置页面签名；不得复用社区权益、SSO、档案或发奖密钥。留空关闭管理接口，不影响论坛登录。
        nonce_redis_url:
          title:
            other: Login Ticket Nonce Redis 地址
          description:
            other: 所有 Answer 实例共享的 Redis 连接地址，用于浏览器绑定流程与 Login Ticket 单次消费；不可用时绑定会安全拒绝。
        level_badge_enabled:
          label:
            other: 显示脉冲等级徽章
          title:
            other: 等级徽章
          description:
            other: 在用户个人页展示其脉冲等级与终身累计贡献值。
      control_center:
        pulse:
          other: 元衡脉冲
        console:
          other: API 控制台
      branding:
        level:
          other: 等级
        contribution:
          other: 贡献值
