# Install in the front proxy's http context, independently of the origin gateway.
# DNS-only: metar.uk -> 64.83.9.190 -> HTTPS 23.94.111.46.
upstream metar_relay_origin {
    server 23.94.111.46:443;
    keepalive 16;
}

map $http_upgrade $metar_relay_connection {
    default upgrade;
    ''      '';
}
map $uri $metar_relay_loggable {
    default 1;
    /api/user-center/login/callback 0;
    ~^/answer/api/v1/connector/redirect/pulse_user_center$ 0;
    ~^/users/(?:auth-landing|confirm-email)$ 0;
}
log_format metar_relay_no_query '$remote_addr [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    'upstream=$upstream_status time=$request_time';

server {
    listen 80;
    listen [::]:80;
    server_name metar.uk www.metar.uk;
    server_tokens off;
    access_log /var/log/nginx/metar-relay.access.log metar_relay_no_query if=$metar_relay_loggable;
    error_log /var/log/nginx/metar-relay.error.log crit;

    # The front proxy renews its own certificate here. An absent challenge falls
    # back to the origin, so its independent certificate renewal also survives.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/metar-acme;
        default_type text/plain;
        try_files $uri @metar_origin_acme;
    }
    location @metar_origin_acme {
        proxy_pass http://23.94.111.46;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location = /baidu_verify_codeva-5q1djDn6Ob.html {
        proxy_pass https://metar_relay_origin;
        proxy_ssl_server_name on;
        proxy_ssl_name metar.uk;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host metar.uk;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_cache off;
    }
    location / {
        if ($request_method ~ ^(GET|HEAD)$) { return 301 https://metar.uk$request_uri; }
        return 308 https://metar.uk$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name metar.uk www.metar.uk;
    ssl_certificate /etc/letsencrypt/live/metar.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metar.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 50m;
    access_log /var/log/nginx/metar-relay.access.log metar_relay_no_query if=$metar_relay_loggable;
    error_log /var/log/nginx/metar-relay.error.log crit;

    location / {
        proxy_pass https://metar_relay_origin;
        proxy_ssl_server_name on;
        proxy_ssl_name metar.uk;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 5;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $metar_relay_connection;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_redirect off;
    }
}
