# Optional migration compatibility. Load on both gateways only while the
# independent metar.uk certificate remains installed. New installations do
# not need this file. HTTP ACME delegates to the primary gateway configuration.
server {
    listen 80;
    listen 443 ssl http2;
    server_name metar.uk www.metar.uk;
    ssl_certificate /etc/letsencrypt/live/metar.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metar.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "no-referrer" always;

    # A write cannot safely carry the old origin's session into the new origin.
    if ($request_method !~ ^(GET|HEAD)$) { return 409; }

    # Browser flow cookies are host-only. Restart SSO rather than forwarding a
    # ticket whose flow cannot be verified on the new domain.
    location = /api/user-center/login/callback {
        return 302 https://metarhub.com/users/login;
    }
    location = /answer/api/v1/connector/redirect/pulse_user_center {
        return 302 https://metarhub.com/users/login;
    }
    # Reuse this host's primary HTTP ACME handler, including the edge's
    # origin fallback. The fixed Host prevents a legacy-vhost proxy loop.
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header Host metarhub.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
    }
    location / {
        return 301 https://metarhub.com$request_uri;
    }
}
