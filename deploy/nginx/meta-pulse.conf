# Meta Pulse community edge. Load this file inside nginx's `http` context and
# production domain: metar.uk (www.metar.uk redirects to the apex).
#
# Public topology:
#   https://metar.uk/       Apache Answer (primary product)
#   https://metar.uk/blog/  VitePress content
#
# new-api runs independently on its existing domain/server. This gateway never
# proxies new-api or pulse-api, so a community outage cannot enter their request
# path. The Answer plugin opens new-api's HTTPS SSO start URL in the browser.

upstream forum {
    server forum:80;
    keepalive 16;
}

# Answer v1.7 uses `visit` as its authentication cookie. Forward only that
# cookie during normal community traffic; parent-domain/new-api cookies can
# never reach Answer.
map $cookie_visit $forum_cookie {
    ""      "";
    default "visit=$cookie_visit";
}

# The Connector start endpoint creates Redis-backed browser flow records. Bound
# it at the only public edge so unauthenticated traffic cannot fill Redis.
limit_req_zone $binary_remote_addr zone=community_connector:10m rate=10r/m;

# Never log query strings or Referer at the community edge. Answer puts short-
# lived access tokens, binding keys and SSO tickets in URLs, so the default
# combined format is unsafe even outside the explicitly protected locations.
log_format community_no_query '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                              '"$http_user_agent"';

server {
    listen 80;
    server_name metar.uk www.metar.uk;
    access_log /dev/stdout community_no_query;

    # Certbot renews by webroot after the initial standalone issuance.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
        try_files $uri =404;
    }

    location / {
        return 308 https://metar.uk$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.metar.uk;

    ssl_certificate     /etc/letsencrypt/live/metar.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metar.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    access_log off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 308 https://metar.uk$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name metar.uk;

    ssl_certificate     /etc/letsencrypt/live/metar.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metar.uk/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    access_log /dev/stdout community_no_query;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /blog {
        return 308 /blog/;
    }

    location /blog/ {
        root /var/www;
        try_files $uri $uri/ $uri.html /blog/index.html;
        # A location-level add_header stops inheritance on nginx 1.27, so the
        # common security headers are repeated deliberately.
        add_header Cache-Control "public, max-age=3600" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # Normalize the public UserCenter agent response before Answer's frontend
    # consumes it. v1.7.1 otherwise advertises framework redirect endpoints
    # even when local accounts remain enabled, which hijacks `/users/register`.
    # Disable compression so sub_filter sees the JSON bytes, and disable caches
    # because these two URLs are part of the authentication boundary. Keep the
    # replacement URLs relative: Answer compares `/users/register` literally
    # before deciding whether to redirect its local registration route.
    location = /answer/api/v1/user-center/agent {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options SAMEORIGIN always;

        proxy_pass http://forum;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_set_header New-Api-User "";
        proxy_set_header X-Pulse-User-Id "";
        proxy_set_header X-Pulse-Role "";
        proxy_set_header X-Pulse-Timestamp "";
        proxy_set_header X-Pulse-Nonce "";
        proxy_set_header X-Pulse-Signature "";
        proxy_set_header Cookie $forum_cookie;
        proxy_hide_header ETag;
        proxy_cookie_flags visit secure httponly samesite=lax;

        sub_filter_types application/json;
        sub_filter_once on;
        sub_filter '"login_redirect_url":"https://metar.uk/answer/api/v1/user-center/login/redirect"'
                   '"login_redirect_url":"/answer/api/v1/connector/login/pulse_user_center"';
        sub_filter '"sign_up_redirect_url":"https://metar.uk/answer/api/v1/user-center/sign-up/redirect"'
                   '"sign_up_redirect_url":"/users/register"';
    }

    # Answer v1.7.1 advertises UserCenter redirect endpoints whenever a
    # UserCenter plugin is enabled. Empty plugin redirects collapse to the
    # non-existent `/login/` parent, and its sign-up handler mistakenly reads
    # LoginRedirectURL. Adapt those framework routes at the public edge: the
    # external-login button enters the hardened Connector flow, while every
    # registration button stays on Answer's independent local account page.
    location = /answer/api/v1/user-center/login/redirect {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options SAMEORIGIN always;
        return 302 /answer/api/v1/connector/login/pulse_user_center;
    }

    # Compatibility for links already reduced to the parent by an empty
    # UserCenter redirect before this fix was deployed.
    location = /answer/api/v1/user-center/login/ {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options SAMEORIGIN always;
        return 302 /answer/api/v1/connector/login/pulse_user_center;
    }

    location = /answer/api/v1/user-center/sign-up/redirect {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options SAMEORIGIN always;
        return 302 /users/register;
    }

    location = /answer/api/v1/user-center/sign-up/ {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options SAMEORIGIN always;
        return 302 /users/register;
    }

    location = /answer/api/v1/connector/login/pulse_user_center {
        limit_req zone=community_connector burst=5 nodelay;
        limit_req_status 429;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options SAMEORIGIN always;

        proxy_pass http://forum;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header New-Api-User "";
        proxy_set_header X-Pulse-User-Id "";
        proxy_set_header X-Pulse-Role "";
        proxy_set_header X-Pulse-Timestamp "";
        proxy_set_header X-Pulse-Nonce "";
        proxy_set_header X-Pulse-Signature "";
        proxy_set_header Cookie $forum_cookie;
        proxy_cookie_flags meta_pulse_forum_flow secure httponly samesite=lax;
        proxy_cookie_flags visit secure httponly samesite=lax;
    }

    # new-api has a fixed callback path. Internally rewrite it to Answer's
    # Connector receiver without changing new-api source code. Original query
    # parameters are retained by nginx, but never written to access logs.
    location = /api/user-center/login/callback {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        proxy_pass http://forum/answer/api/v1/connector/redirect/pulse_user_center;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        proxy_set_header New-Api-User "";
        proxy_set_header X-Pulse-User-Id "";
        proxy_set_header X-Pulse-Role "";
        proxy_set_header X-Pulse-Timestamp "";
        proxy_set_header X-Pulse-Nonce "";
        proxy_set_header X-Pulse-Signature "";
        # Only the short-lived browser flow marker is needed on callback.
        proxy_set_header Cookie "meta_pulse_forum_flow=$cookie_meta_pulse_forum_flow";
        proxy_cookie_flags meta_pulse_forum_flow secure httponly samesite=lax;
        proxy_cookie_flags visit secure httponly samesite=lax;
    }

    # Answer places a short-lived access token or binding key in these landing
    # URLs. Never persist those query strings in access logs or Referer headers.
    location ~ ^/users/(?:auth-landing|confirm-email)$ {
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options SAMEORIGIN always;

        proxy_pass http://forum;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header New-Api-User "";
        proxy_set_header X-Pulse-User-Id "";
        proxy_set_header X-Pulse-Role "";
        proxy_set_header X-Pulse-Timestamp "";
        proxy_set_header X-Pulse-Nonce "";
        proxy_set_header X-Pulse-Signature "";
        proxy_set_header Cookie $forum_cookie;
        proxy_cookie_flags visit secure httponly samesite=lax;
    }

    location / {
        proxy_pass http://forum;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Answer's frontend uses Authorization for its own API session, so it
        # must remain intact here. new-api identity and Pulse service-signature
        # headers never belong on community requests and are always removed.
        proxy_set_header New-Api-User "";
        proxy_set_header X-Pulse-User-Id "";
        proxy_set_header X-Pulse-Role "";
        proxy_set_header X-Pulse-Timestamp "";
        proxy_set_header X-Pulse-Nonce "";
        proxy_set_header X-Pulse-Signature "";
        proxy_set_header Cookie $forum_cookie;
        proxy_cookie_flags visit secure httponly samesite=lax;
    }
}
