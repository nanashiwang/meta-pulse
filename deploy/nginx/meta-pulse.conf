# Meta Pulse public edge. This file is loaded inside nginx's `http` context.
# Replace yourdomain.com with the production domain and mount one certificate
# whose SAN covers both yourdomain.com and forum.yourdomain.com.
#
# Public topology:
#   https://yourdomain.com/               new-api console and API
#   https://yourdomain.com/blog/          VitePress static site
#   https://yourdomain.com/console/pulse  Pulse UI served by new-api
#   https://forum.yourdomain.com/          Apache Answer
#
# pulse-api has no public upstream here. Browsers can only use the signed BFF
# implemented by new-api under /api/pulse/*.

upstream new_api {
    server new-api:3000;
    keepalive 32;
}

upstream forum {
    server forum:80;
    keepalive 16;
}

# Answer v1.7 uses `visit` as its only authentication cookie. Forwarding an
# allowlisted cookie instead of the raw Cookie header prevents a parent-domain
# new-api `session` cookie from ever reaching Answer.
map $cookie_visit $forum_cookie {
    ""      "";
    default "visit=$cookie_visit";
}

# Login Tickets are query parameters. Do not retain the callback query in the
# edge access log or send it as a Referer.
map $uri $forum_access_loggable {
    default                                  1;
    /api/user-center/login/callback          0;
}

map $uri $forum_referrer_policy {
    default                                  "strict-origin-when-cross-origin";
    /api/user-center/login/callback          "no-referrer";
}

server {
    listen 80;
    server_name yourdomain.com forum.yourdomain.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name yourdomain.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # The old shared-host forum path is redirect-only. No Cookie header is ever
    # proxied from this virtual host to Answer.
    location = /forum {
        return 308 https://forum.yourdomain.com/;
    }

    location ~ ^/forum/(.*)$ {
        return 308 https://forum.yourdomain.com/$1$is_args$args;
    }

    location /blog/ {
        alias /var/www/blog/;
        try_files $uri $uri/ $uri.html /blog/index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # This is new-api's browser-authenticated BFF route, not pulse-api. Clear
    # all service-auth headers so only new-api can construct the signed request
    # sent over the private network to Pulse.
    location ^~ /api/pulse/ {
        proxy_pass http://new_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Pulse-User-Id "";
        proxy_set_header X-Pulse-Role "";
        proxy_set_header X-Pulse-Timestamp "";
        proxy_set_header X-Pulse-Nonce "";
        proxy_set_header X-Pulse-Signature "";
        proxy_cookie_flags session secure httponly samesite=strict;
    }

    location / {
        proxy_pass http://new_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cookie_flags session secure httponly samesite=strict;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name forum.yourdomain.com;

    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    access_log /var/log/nginx/forum.access.log combined if=$forum_access_loggable;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy $forum_referrer_policy always;

    location / {
        proxy_pass http://forum;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $forum_cookie;
        proxy_cookie_domain ~.* forum.yourdomain.com;
        proxy_cookie_flags visit secure httponly samesite=lax;
    }
}
