# Single hostname for all three tracks: search authority accumulates on one
# domain, and new-api's session cookie is visible to the forum.
#
#   /            new-api console
#   /blog/       VitePress static site
#   /forum/      Apache Answer
#   /console/pulse   Meta Pulse UI (served by new-api)

upstream new_api {
    server new-api:3000;
}

upstream pulse_api {
    server pulse-api:8088;
}

upstream forum {
    server forum:80;
}

server {
    listen 80;
    server_name _;

    # Blog: static, aggressively cacheable.
    location /blog/ {
        alias /var/www/blog/;
        try_files $uri $uri/ $uri.html /blog/index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Forum: Answer server-side renders /questions, /tags and /users for
    # crawlers, so requests pass straight through without prerendering.
    location /forum/ {
        proxy_pass http://forum/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Meta Pulse API is internal-only: the browser reaches it through new-api's
    # signed BFF, never directly. Exposing it here would let a browser assert
    # its own user_id (AGENTS.md invariant 13).
    location /api/pulse/ {
        deny all;
        return 403;
    }

    location / {
        proxy_pass http://new_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
