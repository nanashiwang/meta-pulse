# 复制或合并到仓库根目录 docker-compose.override.yml。
# 如需发布 Pulse API 到 WireGuard，请在同一文件继续添加 pulse-api.ports。
services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/meta-pulse.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./sites/blog/docs/.vitepress/dist:/var/www/blog:ro
      - ./.data/certbot:/var/www/certbot:ro
    depends_on:
      - forum
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
