# Include this exact location inside the HTTPS server block of the existing
# new-api reverse proxy. It creates a same-origin document before the SSO start
# request, so a SameSite=Strict new-api session cookie is sent on the retry.
# No user input or open redirect is accepted.
location = /api/forum/sso/bootstrap {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    return 200 '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=/api/forum/sso/start"><a href="/api/forum/sso/start">继续</a>';
}
