name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (pulse + forum plugin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      # Checks every Go file in the workspace, not a hardcoded directory list,
      # so new modules cannot silently escape formatting checks.
      - name: Check formatting
        run: |
          files=$(gofmt -l services)
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./services/pulse/... ./services/forum-plugin/user-center-pulse/...

      - name: Test
        run: make test

      - name: Production Compose role configuration
        run: make deploy-config-test

      - name: Build
        run: make build-pulse

  mysql-integration:
    name: MySQL financial invariants (no skipped DB tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: pulse_ci_test_only
          MYSQL_DATABASE: pulse_integration
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -ppulse_ci_test_only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      PULSE_INTEGRATION_DSN: root:pulse_ci_test_only@tcp(127.0.0.1:3306)/pulse_integration?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: services/pulse/go.sum
      - name: Enable append-only trigger migrations in disposable database
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: >-
          docker exec "$MYSQL_CONTAINER" sh -c
          'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot -e "SET GLOBAL log_bin_trust_function_creators=1;"'
      - name: Transaction, concurrency, cross-period replay and recovery regressions
        run: make test-integration

  blog:
    name: Blog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: sites/blog
        run: pnpm install --no-frozen-lockfile

      - name: Build
        working-directory: sites/blog
        run: pnpm build
