services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: meta_pulse
      MYSQL_USER: pulse
      MYSQL_PASSWORD: ${PULSE_DB_PASSWORD:?set PULSE_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${PULSE_DB_ROOT_PASSWORD:?set PULSE_DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 00002 creates an append-only trigger. This server setting lets the
      # least-privileged pulse user create it during local bootstrap while
      # keeping binary logging enabled. Production DBAs must configure the
      # equivalent setting before running migrations.
      - --log-bin-trust-function-creators=1
    volumes:
      - pulse_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${PULSE_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  pulse-api:
    build:
      context: .
      dockerfile: services/pulse/Dockerfile
    restart: unless-stopped
    environment:
      PULSE_ENV: ${PULSE_ENV:-development}
      PULSE_HTTP_ADDR: :8088
      PULSE_DB_DSN: pulse:${PULSE_DB_PASSWORD}@tcp(mysql:3306)/meta_pulse?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai
      PULSE_REDIS_ADDR: redis:6379
      PULSE_REDIS_PASSWORD: ${PULSE_REDIS_PASSWORD:-}
      PULSE_REDIS_DB: ${PULSE_REDIS_DB:-0}
      NEWAPI_INTERNAL_BASE_URL: ${NEWAPI_INTERNAL_BASE_URL:-}
      PULSE_SERVICE_HMAC_SECRET: ${PULSE_SERVICE_HMAC_SECRET:-}
      PULSE_SERVICE_HMAC_SECRET_PREVIOUS: ${PULSE_SERVICE_HMAC_SECRET_PREVIOUS:-}
      PULSE_USER_BFF_HMAC_SECRET: ${PULSE_USER_BFF_HMAC_SECRET:-}
      PULSE_USER_BFF_HMAC_SECRET_PREVIOUS: ${PULSE_USER_BFF_HMAC_SECRET_PREVIOUS:-}
      PULSE_ADMIN_HMAC_SECRET: ${PULSE_ADMIN_HMAC_SECRET:-}
      PULSE_ADMIN_HMAC_SECRET_PREVIOUS: ${PULSE_ADMIN_HMAC_SECRET_PREVIOUS:-}
      PULSE_REWARD_RANDOM_SECRET: ${PULSE_REWARD_RANDOM_SECRET:-replace-me}
      PULSE_REWARD_SHADOW_MODE: ${PULSE_REWARD_SHADOW_MODE:-true}
      PULSE_SETTLEMENT_BATCH_SIZE: ${PULSE_SETTLEMENT_BATCH_SIZE:-100}
      PULSE_CONTENT_MIN_PAID_CONTRIBUTION_MILLI: ${PULSE_CONTENT_MIN_PAID_CONTRIBUTION_MILLI:-1000}
      PULSE_CONTENT_MAX_USER_PERIOD_AMOUNT: ${PULSE_CONTENT_MAX_USER_PERIOD_AMOUNT:-100}
      PULSE_CONTENT_MAX_DAILY_AMOUNT: ${PULSE_CONTENT_MAX_DAILY_AMOUNT:-1000}
      PULSE_TICKET_THRESHOLD_MILLI: ${PULSE_TICKET_THRESHOLD_MILLI:-1000}
    # Internal-only: browsers reach Pulse through new-api's signed BFF.
    expose:
      - "8088"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8088/readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  pulse-worker:
    build:
      context: .
      dockerfile: services/pulse/Dockerfile
    restart: unless-stopped
    entrypoint: ["meta-pulse-worker"]
    environment:
      PULSE_ENV: ${PULSE_ENV:-development}
      PULSE_WORKER_HTTP_ADDR: ":8089"
      PULSE_DB_DSN: pulse:${PULSE_DB_PASSWORD}@tcp(mysql:3306)/meta_pulse?charset=utf8mb4&parseTime=True&loc=Asia%2FShanghai
      PULSE_REDIS_ADDR: redis:6379
      PULSE_REDIS_PASSWORD: ${PULSE_REDIS_PASSWORD:-}
      PULSE_REDIS_DB: ${PULSE_REDIS_DB:-0}
      NEWAPI_LOG_DSN: ${NEWAPI_LOG_DSN:-}
      FORUM_DB_DSN: ${FORUM_DB_DSN:-}
      NEWAPI_INTERNAL_BASE_URL: ${NEWAPI_INTERNAL_BASE_URL:-}
      PULSE_SERVICE_HMAC_SECRET: ${PULSE_SERVICE_HMAC_SECRET:-}
      PULSE_SERVICE_HMAC_SECRET_PREVIOUS: ${PULSE_SERVICE_HMAC_SECRET_PREVIOUS:-}
      PULSE_REWARD_RANDOM_SECRET: ${PULSE_REWARD_RANDOM_SECRET:-replace-me}
      PULSE_REWARD_SHADOW_MODE: ${PULSE_REWARD_SHADOW_MODE:-true}
      PULSE_INGEST_BATCH_SIZE: ${PULSE_INGEST_BATCH_SIZE:-500}
      PULSE_SETTLEMENT_BATCH_SIZE: ${PULSE_SETTLEMENT_BATCH_SIZE:-100}
      PULSE_PERIOD_CLOSE_BATCH_SIZE: ${PULSE_PERIOD_CLOSE_BATCH_SIZE:-20}
      PULSE_PERIOD_CLOSE_REQUIRE_WATERMARK: ${PULSE_PERIOD_CLOSE_REQUIRE_WATERMARK:-true}
      PULSE_PERIOD_REWARDS_ENABLED: ${PULSE_PERIOD_REWARDS_ENABLED:-false}
      PULSE_CONTENT_INGEST_BATCH_SIZE: ${PULSE_CONTENT_INGEST_BATCH_SIZE:-100}
      PULSE_CONTENT_MIN_PAID_CONTRIBUTION_MILLI: ${PULSE_CONTENT_MIN_PAID_CONTRIBUTION_MILLI:-1000}
      PULSE_CONTENT_MAX_USER_PERIOD_AMOUNT: ${PULSE_CONTENT_MAX_USER_PERIOD_AMOUNT:-100}
      PULSE_CONTENT_MAX_DAILY_AMOUNT: ${PULSE_CONTENT_MAX_DAILY_AMOUNT:-1000}
      PULSE_TICKET_THRESHOLD_MILLI: ${PULSE_TICKET_THRESHOLD_MILLI:-1000}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8089/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Forum database is a separate logical DB with its own account, per
  # ARCHITECTURE.md section 31 (services/databases/permissions stay independent).
  forum-mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: meta_pulse_forum
      MYSQL_USER: forum
      MYSQL_PASSWORD: ${FORUM_DB_PASSWORD:?set FORUM_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${FORUM_DB_ROOT_PASSWORD:?set FORUM_DB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - forum_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${FORUM_DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Apache Answer rebuilt with the Pulse user center plugin compiled in.
  forum:
    build:
      context: .
      dockerfile: services/forum/Dockerfile
    restart: unless-stopped
    # Internal-only: the HTTPS gateway is the sole public Answer entry.
    expose:
      - "80"
    volumes:
      - forum_data:/data
    depends_on:
      forum-mysql:
        condition: service_healthy

volumes:
  pulse_mysql_data:
  forum_mysql_data:
  forum_data:
