 {id:'q1',title:'你在用 Agent 自动化哪些重复工作？来分享一个真实场景',excerpt:'不是演示视频里的全能助手，而是每天真正在跑、能省下时间的那一个工作流。我们更想看具体过程和边界。',author:'林舟',initial:'舟',avatar:1,topic:'agents',tags:['Agent','工作流'],votes:42,answers:18,views:1280,time:'12 分钟前',featured:true,pinned:true,solved:false,body:'最近在整理日常工作里可以被自动化的环节，发现真正有价值的场景往往并不宏大。\n\n我的示例是：读取一批公开更新 → 按既定规则分类 → 输出待确认的摘要 → 人工审核后再发布。最重要的是保留人工确认，而不是让智能体自动把一切发出去。\n\n想请大家分享三个信息：\n1. 你交给 Agent 的具体任务是什么？\n2. 哪一步仍然需要人工判断？\n3. 出错之后，你如何发现并恢复？\n\n这是一条用于展示讨论结构的示例内容，不是社区真实帖子。'},

 {id:'q4',title:'周末作品：一个只做一件事的会议行动项整理器',excerpt:'不做全能助手，只把待办、负责人和截止时间梳理清楚。附上原型截图思路与实现记录。',author:'阿澈',initial:'澈',avatar:4,topic:'showcase',tags:['作品','独立开发'],votes:36,answers:9,views:920,time:'2 小时前',featured:true,solved:false,body:'这次练习的目标很简单：输入已经授权并脱敏的会议笔记，输出行动项清单。\n\n我把页面分成原文、提取结果和人工确认三个区域。每条行动项都能回到原文核对，没有把模型输出直接写入项目管理系统。\n\n欢迎讨论这个产品形态。本条是交互原型中的虚构作品示例。'},

function closeModal(){if($('#dialog-root').innerHTML){$('#dialog-root').innerHTML='';document.body.style.overflow='';try{focusBeforeModal?.focus()}catch(_){}}}
const filterPosts=(list,tab)=>{if(tab==='unanswered')return list.filter(p=>countAnswers(p)===0);if(tab==='featured')return list.filter(p=>p.featured);if(tab==='latest')return [...list].sort((a,b)=>a.id.startsWith('local-')?-1:b.id.startsWith('local-')?1:0);if(tab==='following')return list.filter(p=>state.follows.includes(p.topic));return list};
function postRows(list){if(state.scenario==='empty'||!list.length)return empty('这里还没有内容','换一个筛选条件，或成为第一个分享经验的人。',link('/publish',I('plus')+'发布一个问题','btn primary'));return list.map(p=>`<article class="feed-row">${avatar(p.author,p.initial,p.avatar)}<div class="row-main"><div class="row-meta">${link('/profile/'+encodeURIComponent(p.author),esc(p.author))}<span>·</span><span>${esc(p.time)}</span>${p.pinned?`<span class="pin">${I('pin','sm')}置顶</span>`:''}${p.solved?badge('已解决','green'):''}${p.status==='pending'?badge('待审核','amber'):''}</div>${link('/question/'+p.id,esc(p.title),'feed-title')}<p class="feed-excerpt">${esc(p.excerpt)}</p><div class="row-footer">${p.tags.slice(0,2).map(t=>link('/topic/'+p.topic,esc(t),'tag')).join('')}<div class="metrics"><span>${I('heart')}${p.votes+(state.votes[p.id]||0)}</span><span>${I('chat')}${countAnswers(p)}</span><span class="views">${I('eye')}${p.views>=1000?(p.views/1000).toFixed(1)+'k':p.views}</span></div></div></div></article>`).join('')}
function tabs(base,current='recommended',choices=[['recommended','推荐'],['latest','最新'],['unanswered','待回答'],['featured','精选']]){return `<div class="tabs">${choices.map(([v,t])=>link(`${base}${base.includes('?')?'&':'?'}tab=${v}`,t,`tab ${current===v?'active':''}`)).join('')}<span class="right muted" style="font-size:10px">${I('filter','sm')}</span></div>`}
function articleCard(a){return link('/article/'+a.id,`<div class="feature-cover ${a.cover}"><div><div class="cover-label">${a.label}</div><div class="cover-graphic mt16">${a.graphic}</div></div>${I(a.icon)}</div><div class="feature-body"><div class="between">${badge(a.category)}<span class="muted" style="font-size:10px">${a.minutes} 分钟</span></div><h3>${a.title}</h3><p>${a.desc}</p><div class="between"><small>${a.author}${PREVIEW_TOOLS?' · 示例内容':''}</small>${I('arrow','sm')}</div></div>`,'feature-card')}
function discover(){const tab=route().query.get('tab')||'recommended';return `${crumb([['发现']])}<div class="discover-layout">${heading('',esc(state.config.heroTitle||'发现'),'',link('/publish',I('plus')+'发布内容','btn primary'))}<section class="featured-section"><div class="section-heading"><h2>精选文章</h2>${link('/knowledge','全部文章 '+I('arrow','sm'),'textlink')}</div><div class="feature-grid">${ARTICLES.slice(0,2).map(a=>articleCard(a)).join('')}</div></section><section class="discussion-section"><div class="section-heading"><h2>社区讨论</h2>${link('/questions','全部讨论 '+I('arrow','sm'),'textlink')}</div><section class="card">${tabs('/discover',tab)}${postRows(filterPosts(allPosts(),tab).slice(0,6))}<div class="feed-count">${link('/questions','查看更多 '+I('arrow','sm'),'textlink')}</div></section></section></div>${footer()}`}
function questions(topicId=null){const topic=getTopic(topicId);const tab=route().query.get('tab')||'recommended';let posts=allPosts();if(topic)posts=posts.filter(p=>p.topic===topic.id);const base=topic?'/topic/'+topic.id:'/questions';return `${crumb(topic?[['全部话题','/topics'],[topic.name]]:[['问答广场']])}${heading(topic?'TOPIC / '+topic.id.toUpperCase():'ASK. SHARE. BUILD.',topic?topic.name:'每个好问题，都值得一个答案。',topic?topic.desc:'在真实问题里交换经验，在有依据的回答里共同成长。',topic?btn(state.follows.includes(topic.id)?I('check')+'已关注':I('plus')+'关注话题','follow-topic',state.follows.includes(topic.id)?'':'primary',`data-id="${topic.id}"`):link('/publish',I('plus')+'发起提问','btn primary'))}<div class="content-grid"><section class="card">${tabs(base,tab)}${postRows(filterPosts(posts,tab))}<div class="feed-count">${posts.length} 条讨论</div></section><aside class="stack">${topic?`<section class="card card-pad"><div class="card-title"><h3>关于这个话题</h3>${I(topic.icon)}</div><p class="muted" style="font-size:12px">${topic.desc}</p><div class="flex wrap mt16">${topic.tags.map(t=>badge(t)).join('')}</div><div class="divider"></div><div class="between"><span class="muted" style="font-size:11px">话题讨论 · 示例</span><strong class="mono">${topic.count}</strong></div>${link('/publish?topic='+topic.id,'在此话题发布 '+I('arrow','sm'),'textlink mt16')}</section>`:''}</aside></div>${footer()}`}
function topicsPage(){return `${crumb([['全部话题']])}${heading('FIND YOUR PEOPLE','找到你正在探索的方向。','关注话题，加入讨论。你的下一位同路人，也许就在这里。')}<div class="topic-grid">${TOPICS.map(t=>`<section class="card topic-card"><a href="#/topic/${t.id}"><div class="topic-icon">${I(t.icon)}</div><h3>${t.name}</h3><p>${t.desc}</p></a><div class="between"><span class="muted">${t.count} 条讨论 · 示例</span>${btn(state.follows.includes(t.id)?I('check','sm')+'已关注':I('plus','sm')+'关注','follow-topic','small',`data-id="${t.id}"`)}</div></section>`).join('')}</div><section class="card card-pad mt24 between"><div><h3>还没有你想聊的话题？</h3><p class="muted mt8" style="font-size:12px">好的社区，应该由真正使用它的人一起定义。</p></div>${link('/support?type=suggestion','建议新话题 '+I('arrow','sm'),'btn')}</section>${footer()}`}
function questionPage(id){const p=getPost(id);if(!p)return notFound();const replies=state.answers[p.id]||[];return `${crumb([[getTopic(p.topic)?.name||'讨论','/topic/'+p.topic],['讨论详情']])}<div class="content-grid"><div><article class="card card-pad"><div class="flex wrap mb16">${link('/topic/'+p.topic,getTopic(p.topic)?.name||'社区','tag')}${p.solved?badge(I('check','sm')+' 已解决','green'):badge('讨论中')}${p.status==='pending'?badge('本地发布 · 待审核','amber'):p.status==='rejected'?badge('已退回修改','red'):p.status==='editorial'?badge('投稿审核通过 · 待编辑发布','amber'):''}</div><h1 class="article-title" style="font-size:26px;margin:10px 0 19px">${esc(p.title)}</h1><div class="flex mb16">${avatar(p.author,p.initial,p.avatar)}<div class="row-meta">${link('/profile/'+encodeURIComponent(p.author),esc(p.author))}<span>· ${esc(p.time)}</span><span>· ${p.views} 次浏览 · 示例</span></div></div><div class="divider"></div><div class="question-layout"><div class="vote-stack">${btn(I('up'),'vote',state.votes[id]?'voted':'',`data-id="${esc(id)}" aria-label="赞同这个问题" aria-pressed="${!!state.votes[id]}"`)}<strong>${p.votes+(state.votes[id]||0)}</strong><button type="button" class="icon-btn ${state.bookmarks.includes(id)?'green':''}" data-action="bookmark" data-id="${esc(id)}" aria-label="收藏问题">${I('bookmark')}</button></div><div class="question-body">${esc(p.body).split('\n\n').map(s=>`<p>${s.replace(/\n/g,'<br>')}</p>`).join('')}<div class="flex wrap mt24">${p.tags.map(t=>link('/topic/'+p.topic,esc(t),'tag')).join('')}</div><div class="question-actions">${btn(I('bookmark','sm')+(state.bookmarks.includes(id)?'已收藏':'收藏'),'bookmark','ghost small',`data-id="${esc(id)}"`)}${btn(I('copy','sm')+'分享','share','ghost small',`data-path="/question/${esc(id)}"`)}${btn(I('flag','sm')+'举报','report','ghost small',`data-id="${esc(id)}"`)}</div></div></div></article><div class="section-heading"><h2>${countAnswers(p)} 条回答 <span class="muted" style="font-size:11px;font-weight:400">· 含示例计数</span></h2><span class="badge">按时间展示</span></div>${state.scenario==='empty'?`<section class="card">${empty('还没有人回答','分享一个思路，也可能帮对方迈出重要的一步。','','chat')}</section>`:`${p.answers>0?`<article class="card answer-card ${p.solved?'accepted':''}"><div class="between"><div class="flex">${avatar('Jo','J',4)}<div><strong style="font-size:12px">Jo</strong><div class="row-meta">贡献者 · 示例回答</div></div></div>${p.solved?badge(I('check','sm')+' 提问者采纳','green'):badge('有帮助的思路','green')}</div><div class="answer-content">${p.id==='q6'?'社区与 API 保持独立是很重要的设计。建议把绑定状态放在账号设置中，让用户在需要 Pulse 权益时再自主选择。':p.id==='q2'?'建议先给每次生成分配独立的展示状态：中断后保留已经显示的内容，明确标记“不完整”。再次尝试时创建新的展示区域，不自动拼接两次结果。\n\n实际恢复能力仍需要按后端协议确认，前端不能假定任意中断都可以续传。':'我会先把“自动执行”和“需要确认”分开。任务是否完成，不只看生成了什么，还要看结果能否核对、失败能否恢复。\n\n先选一个输入稳定、结果可验证的小场景，通常比一开始追求全能更容易验证价值。'}</div><div class="question-actions">${btn(I('heart','sm')+'有帮助','answer-help','ghost small','data-id="seed-'+esc(id)+'"')}${btn(I('chat','sm')+'回复','focus-answer','ghost small')}</div></article>`:''}${replies.map((a,i)=>`<article class="card answer-card"><div class="flex"><span class="avatar a4">${esc(a.author.slice(0,1))}</span><div><strong style="font-size:12px">${esc(a.author)}</strong><div class="row-meta">刚刚 · 本地演示</div></div></div><div class="answer-content">${esc(a.body)}</div></article>`).join('')}`}
<section class="card card-pad mt24" id="answer-form"><h3 class="mb16">分享你的回答</h3>${isLogged()?`<form data-form="answer" data-id="${esc(id)}"><textarea name="answer" rows="5" maxlength="5000" required minlength="8" placeholder="给出具体思路、验证方法或实际经验。不要包含密钥或敏感信息。" aria-label="你的回答"></textarea><div class="between mt16"><small class="muted">仅保存到此浏览器，不会发布到线上。</small><button class="btn primary" type="submit">发布回答 ${I('arrow','sm')}</button></div></form>`:notice(`登录独立社区账号即可回答，无需绑定 API。 ${link('/login?next='+encodeURIComponent('/question/'+id),'登录后回答','textlink')}`)}</section></div><aside class="stack"><section class="card card-pad"><div class="card-title"><h3>关于作者</h3>${I('user','sm')}</div><div class="flex">${avatar(p.author,p.initial,p.avatar)}<div><strong style="font-size:13px">${esc(p.author)}</strong></div></div>${link('/profile/'+encodeURIComponent(p.author),'查看作者主页 '+I('arrow','sm'),'textlink mt16')}</section></aside></div>${footer()}`}
function knowledge(){const cat=route().query.get('category')||'全部';const categories=['全部','接入指南','实战手记','模型评测','工程实践','社区指南','故障复盘'];const articles=ARTICLES.filter(a=>cat==='全部'||a.category===cat);return `${crumb([['知识库']])}${heading('THE METAR JOURNAL','经验，不止停留在讨论里。','把有用的方法写下来，让下一位探索者少走一点弯路。',link('/publish?kind=article',I('edit')+'分享长文','btn'))}<div class="pillbar">${categories.map(c=>link('/knowledge?category='+encodeURIComponent(c),c,`pill ${cat===c?'active':''}`)).join('')}</div>${state.scenario==='empty'?`<section class="card">${empty('这份知识库，等你添上第一笔','当前为空状态演示。恢复正常数据即可查看文章详情。',link('/publish?kind=article','提交一篇长文','btn primary'),'book')}</section>`:`<div class="article-grid">${articles.map(articleCard).join('')}</div>`}<div class="bulletin mt24">${I('file')}<p>本页为知识库内容样式示例。正式长文由 VitePress 管理，投稿先进入审核，不承诺直接发布或发放权益。</p></div>${footer()}`}
function articlePage(id){const a=ARTICLES.find(x=>x.id===id);if(!a)return notFound();const sections=a.id==='community-start'?[['社区账号，独立存在','你可以独立注册社区，参与问答、收藏内容、关注话题。使用社区不需要先绑定元衡 API，也不需要先付费。'],['在合适的时候，再连接 API','可选绑定用于解锁 Pulse 等级与权益。绑定以服务端校验的一对一关系为准，不会根据相同邮箱自动合并，也不能普通自助换绑。'],['内容与权益，分开理解','论坛内容不产生贡献值或脉冲券。内容奖励是独立审核流程，需要资格校验和预算控制，不等于发帖即得奖励。']]:a.id==='start'?[['01 / 明确你要完成的任务','在接入之前，先写下任务输入、预期输出和人工验证方式。把演示中的“看起来能用”变成可以重复检查的完成标准。'],['02 / 区分开发环境与生产环境','不要把密钥写进浏览器代码或公开仓库。原型中所有调用入口都只是展示，不会要求你输入真实 API Key。正式接入请使用服务端凭据配置。'],['03 / 把失败路径也设计出来','前端需要清楚展示加载、中断、失败和重试。第三方返回超时，并不自动证明操作没有发生；涉及权益发放，应由服务端查询原记录确认。'],['04 / 记录必要信息，而不是所有信息','排查问题时，优先记录可定位请求的必要元数据。公开求助前要移除密钥、Cookie、支付信息、私有正文和无关的个人信息。'],['05 / 回到真实使用场景','用一组固定样例核对效果，再决定下一步。不要因为技术演示成功，就直接把未经确认的输出交给外部系统执行。']]:[['把问题缩小到可以验证的程度','这篇文章用于展示知识库的阅读体验和内容层级，不是一份已验证的项目实测报告。建议从一个可观察的任务开始，先界定输入、输出和完成标准。'],['把过程留下来，而不只展示结果','一份可复用的经验，应该说明前提、执行过程、遇到的问题与没有解决的边界。即使结果不理想，也能给下一位实践者提供有效线索。'],['给不确定性留出位置','不要把模型输出直接当作已经确认的事实。把人工检查、来源核对、权限确认与故障恢复设计进工作流，而不是上线之后再补。'],['在社区继续讨论','提出你具体遇到的困难，附上已经脱敏且足以复现的问题描述。读者可以从文章跳转到问答，不必为了讨论重新寻找入口。']];return `${crumb([['知识库','/knowledge'],[a.category]])}<div class="content-grid"><article class="card article-top"><div class="flex">${badge(a.category,'green')}<span class="eyebrow">METAR JOURNAL</span></div><h1 class="article-title">${a.title}</h1><p class="muted" style="font-size:14px;line-height:1.9">${a.desc}</p><div class="between mt24"><div class="flex">${avatar(a.author,a.author.slice(0,1),4)}<div class="row-meta">${a.author} · ${a.minutes} 分钟阅读 · 示例文章</div></div>${btn(I('bookmark','sm'),'bookmark-article','ghost small',`data-id="${a.id}" aria-label="收藏文章"`)}</div><div class="divider"></div><div class="feature-cover ${a.cover}" style="height:190px;border-radius:9px"><div><div class="cover-label">${a.label}</div><div class="cover-graphic mt16">${a.graphic}</div></div>${I(a.icon)}</div><div class="article-body">${sections.map(([h,p],i)=>`<h2 id="section-${i}">${h}</h2><p>${p}</p>${i===1?`<div class="note">最重要的不是功能有多少，而是每一次操作的边界是否清楚、结果是否可核对。</div>`:''}`).join('')}<h2>继续下一步</h2><p>把文章中的思路带进你的场景，在社区交流真正遇到的问题。</p></div><div class="flex wrap mt24">${link('/publish?topic='+a.topic,'就这个话题提问 '+I('arrow','sm'),'btn primary')}${btn(I('copy','sm')+'分享文章','share','',`data-path="/article/${a.id}"`)}</div></article><aside class="stack"><section class="card card-pad"><div class="eyebrow mb16">ON THIS PAGE</div><h3>文章目录</h3><ul class="mini-list">${sections.map(([h],i)=>`<li><span class="number">0${i+1}</span><button type="button" style="background:none;border:0;text-align:left;font-size:11px;padding:0;line-height:1.9" data-action="scroll-section" data-id="section-${i}">${h}</button></li>`).join('')}</ul></section>${PREVIEW_TOOLS?notice('内容样式示例，未连接生产数据。','info','file'):''}</aside></div>${footer()}`}
function loginRequired(title,next=route().path){return `${heading('YOUR COMMUNITY',title,'使用独立社区账号继续，不需要绑定元衡 API。')}<section class="card">${empty('登录后，让这些内容属于你','收藏、草稿、通知与发布内容都与社区账号关联。',link('/login?next='+encodeURIComponent(next),'登录社区','btn primary')+' '+link('/register','独立注册','btn'),'user')}</section>${footer()}`}
function editor(){if(!isLogged())return loginRequired('分享一个值得留下的经验。','/publish');const draftId=route().query.get('draft');const draft=state.drafts.find(d=>d.id===draftId);const topic=route().query.get('topic')||draft?.topic||'dev';const kind=route().query.get('kind')||draft?.kind||'question';return `${crumb([['创作中心']])}${heading('MAKE SOMETHING USEFUL','把你的经验，变成别人的起点。','描述问题，分享过程。每个具体的经验都有价值。',link('/drafts','我的草稿 '+I('arrow','sm'),'btn'))}<div class="content-grid"><form class="card card-pad" data-form="publish" data-draft="${esc(draftId||'')}"><div class="form-grid"><div class="field"><label for="post-kind">内容类型</label><select id="post-kind" name="kind"><option value="question" ${kind==='question'?'selected':''}>发起提问</option><option value="share" ${kind==='share'?'selected':''}>分享经验 / 作品</option><option value="article" ${kind==='article'?'selected':''}>知识库投稿（需编辑审核）</option></select></div><div class="field"><label for="post-topic">发布到话题</label><select id="post-topic" name="topic">${TOPICS.map(t=>`<option value="${t.id}" ${topic===t.id?'selected':''}>${t.name}</option>`).join('')}</select></div></div><div class="field"><label for="post-title">标题</label><input id="post-title" name="title" required minlength="8" maxlength="100" placeholder="清晰、具体地描述你的问题或经验" value="${esc(draft?.title||'')}"><small>8–100 个字符。比如：流式输出中断后，前端应该如何展示？</small></div><div class="field"><label for="post-body">正文</label><div class="editor-toolbar">${btn('<strong>B</strong>','editor-format','ghost small','data-format="bold" aria-label="插入粗体标记"')}${btn(I('code','sm'),'editor-format','ghost small','data-format="code" aria-label="插入代码标记"')}${btn(I('link','sm'),'editor-format','ghost small','data-format="link" aria-label="插入链接格式"')}<span style="flex:1"></span>${btn(I('eye','sm')+'预览','editor-preview','ghost small')}</div><textarea id="post-body" class="editor-text" name="body" required minlength="20" maxlength="20000" placeholder="可以包含：背景与目标、已尝试的方法、具体问题、希望得到怎样的帮助。\n\n请勿粘贴真实密钥、Token、Cookie 或未脱敏的数据。">${esc(draft?.body||'')}</textarea><div id="editor-preview" class="editor-preview hide"></div><small>基础标记编辑 · 预览以安全纯文本展示，不执行 HTML。</small></div><div class="field"><label for="post-tags">补充标签</label><input id="post-tags" name="tags" maxlength="60" placeholder="用逗号分隔，最多 3 个" value="${esc(draft?.tags||'')}"></div><label class="checkrow"><input name="agree" type="checkbox" required><span>我确认已移除敏感信息，并同意${link('/guidelines','社区内容规范','green')}。此原型仅做本地发布演示。</span></label><div class="between mt24">${btn(I('file','sm')+'保存草稿','save-draft','')}<button type="submit" class="btn primary">提交发布 ${I('arrow','sm')}</button></div></form></div>${footer()}`}
function searchPage(){const q=route().query.get('q')||'';const type=route().query.get('type')||'all';const key=q.toLocaleLowerCase();const ps=allPosts().filter(p=>(p.title+' '+p.excerpt+' '+p.tags.join(' ')).toLocaleLowerCase().includes(key));const as=ARTICLES.filter(a=>(a.title+' '+a.desc+' '+a.category).toLocaleLowerCase().includes(key));const choices=[['all','全部'],['questions','讨论'],['articles','文章']];return `${crumb([['搜索']])}${heading('FIND THE SIGNAL',q?'“'+esc(q)+'” 的搜索结果':'找一个答案，也找一点灵感。','搜索当前原型中的示例内容，不发送到任何服务器。')}<form data-form="search" class="flex mb16"><input type="search" aria-label="搜索关键词" name="q" value="${esc(q)}" placeholder="输入关键词，如 Agent、API、知识库"><button type="submit" class="btn primary">${I('search')}搜索</button></form><div class="pillbar">${choices.map(([v,t])=>link('/search?q='+encodeURIComponent(q)+'&type='+v,t,`pill ${v===type?'active':''}`)).join('')}</div><section class="card">${state.scenario==='empty'||(type==='articles'?!as.length:type==='questions'?!ps.length:!ps.length&&!as.length)?empty('没有找到相关内容','换一个更具体的关键词，或者向社区发起一个新问题。',link('/publish','发起提问','btn primary'),'search'):`${type!=='articles'?ps.map(p=>`<article class="result-row">${badge('问答 · '+getTopic(p.topic).name)}${link('/question/'+p.id,'<h3>'+esc(p.title)+'</h3>')}<p>${esc(p.excerpt)}</p><small class="muted">${p.author} · ${p.answers} 条回答 · 示例</small></article>`).join(''):''}${type!=='questions'?as.map(a=>`<article class="result-row">${badge('知识库 · '+a.category,'green')}${link('/article/'+a.id,'<h3>'+a.title+'</h3>')}<p>${a.desc}</p><small class="muted">${a.minutes} 分钟阅读 · 示例</small></article>`).join(''):''}`}</section>${footer()}`}
function pulsePage(){const bound=isBound();const down=state.scenario==='degraded';const blank=state.scenario==='empty';const tickets=blank?0:state.tickets;return `${crumb([['Pulse 权益']])}<div class="page-heading"><div><div class="eyebrow">REAL USAGE. LASTING VALUE.</div><h1>每一次调用，都有回响。</h1><p>元衡脉冲计划 · 真实付费使用之后的积累与回馈</p></div>${link('/pulse/rules','规则与说明 '+I('arrow','sm'),'btn')}</div>${down?`<div class="state-banner">${notice('Pulse 权益服务暂不可用，当前不展示过期权益、不接受开启操作。社区浏览与登录不受影响，API 调用请继续前往独立控制台。','warn','server')}</div>`:''}<section class="pulse-hero"><div><div class="flex">${badge('<i class="dot"></i> 演示周期 · 第 007 期')}<span class="eyebrow">SEP 01 — SEP 10</span></div><h1>把真实使用，<br>变成持续积累。</h1><p>贡献值来自合格的真实付费调用，不是签到，也不是购买机会。社区内容与互动不会生成脉冲券。</p><div class="flex mt24">${link(bound?'/pulse/rewards':'/settings/binding',bound?'查看我的回馈 '+I('arrow','sm'):'可选绑定，解锁权益 '+I('link','sm'),'btn lime')}${link('/pulse/rules','了解运作方式','btn ghost')}</div></div><div class="pulse-orbit" aria-label="演示周期第七天"><div><small>CURRENT CYCLE</small><strong>07<span style="font-size:18px">/10</span></strong><small>第 7 天 · 示例</small></div></div></section>${!bound?`<div class="card mt24 card-pad"><div class="between wrap"><div class="flex">${I('link','lg')}<div><h3>社区是独立的，权益连接由你决定。</h3><p class="muted mt8" style="font-size:12px">无需绑定也能发帖、回答和收藏。绑定元衡 API 后，才展示个人等级与 Pulse 权益。</p></div></div>${link('/settings/binding',isLogged()?'连接我的 API 账号':'登录社区后绑定','btn primary')}</div></div><div class="content-grid mt24"><section class="card card-pad"><h3>从真实调用，到看得见的回馈</h3><div class="step-list">${[['1','正常使用元衡 API','真实付费调用完成后，由后台按合格日志计算贡献。'],['2','形成贡献值与脉冲券','权益根据当期规则形成，浏览器不计算可信经济结果。'],['3','开启脉冲，查看发放状态','每次开启消耗一张券，回馈最终通过 new-api 入账。'],['4','参加 10 天周期结算','当期规则、预算与结算状态由服务端确定。']].map(([n,t,d])=>`<div><span class="number">${n}</span><section><h3 style="font-size:13px">${t}</h3><p>${d}</p></section></div>`).join('')}</div></section><aside class="stack"></aside></div>`:`<div class="stats-grid mt24">${[['本期贡献值',down?'—':blank?'0':'12,480','来自合格付费使用 · 示例','chart'],['可用脉冲券',down?'—':tickets,'开启一次消耗 1 券','ticket'],['已到账调用额度',down?'—':blank?'$0.00':money(state.rewards.filter(r=>r.status==='settled').reduce((s,r)=>s+r.cents,0)),'非现金、不可转让 · 示例','spark'],['成长等级',down?'—':'L3','等级不等于社区治理权限','shield']].map(([l,v,s,i])=>`<div class="card stat"><div class="label">${l}${I(i,'sm')}</div><strong>${v}</strong><small>${s}</small></div>`).join('')}</div><div class="pulse-open-box mt24"><section class="card pulse-action"><div class="pulse-symbol">${I('pulse','lg')}</div><div class="eyebrow">YOUR NEXT PULSE</div><h2>${down?'权益服务暂不可用':tickets?'让这次积累，产生回响。':'下一次积累，从真实使用开始。'}</h2><p>${down?'暂时无法确认券和预算状态，因此不开启新操作。恢复后查询原记录，避免重复发放。':tickets?'每次开启消耗 1 张脉冲券。最终结果与到账状态以服务端记录为准，不承诺固定回报。':'当前无可用脉冲券。请按实际需要使用 API，不必为了权益制造额外调用。'}</p>${btn(I('pulse')+(down?'暂不可开启':tickets?'开启一次脉冲 · 1 券':'暂无可用脉冲券'),'open-pulse','primary large',down||!tickets?'disabled':'')}<small>演示行为：固定示例结果，仅改变本地数据</small>${down?btn(I('refresh','sm')+'恢复正常数据演示','scenario-normal','ghost small'):''}</section><section class="card chart-card"><div class="card-title"><h3>本期贡献轨迹</h3>${badge('示例数据')}</div><div class="flex" style="align-items:baseline"><strong class="mono" style="font-size:25px">${down?'—':blank?'0':'12,480'}</strong><span class="muted" style="font-size:11px">累计贡献值</span></div>${down?empty('等待服务恢复','不把缺失数据展示成零值。','','pulse'):`<div class="bars" role="img" aria-label="演示贡献趋势，非实际消费数据">${[35,54,38,74,60,93,82,0,0,0].map((v,i)=>`<div class="bar-item ${i===6?'current':i>6?'future':''}"><span class="bar" style="height:${blank?2:Math.max(3,v)}%"></span><span>${i+1}</span></div>`).join('')}</div><div class="between mt16"><small class="muted">9 月 · 演示周期</small>${link('/pulse/rules','查看贡献规则','textlink')}</div>`}</section></div><section class="card mt24"><div class="card-title card-pad" style="margin:0"><h3>最近回馈</h3>${link('/pulse/rewards','全部记录 '+I('arrow','sm'),'textlink')}</div>${down?notice('暂无法查询奖励记录。请勿据此判断没有奖励或操作失败。','warn'):rewardTable(blank?[]:state.rewards.slice(0,3))}</section>`}<div class="bulletin mt24">${I('shield')}<p>回馈不是现金，不提供提现或转让；API 余额与最终入账由 new-api 管理。原型中的额度、等级、周期与数字仅用于展示，不代表正式活动参数。</p></div>${footer()}`}
function pulseRules(){return `${crumb([['Pulse 权益','/pulse'],['规则与说明']])}${heading('HOW PULSE WORKS','看得懂的积累，查得到的回馈。','以下是产品边界说明；正式周期参数、奖励范围和生效版本以服务端发布为准。')}<div class="content-grid"><section class="card card-pad article-body"><h2 style="margin-top:0">真实使用，是唯一的起点。</h2><p>Pulse 基于元衡 API 的合格真实付费调用建立。社区发帖、点赞、回答以及单纯充值，不会直接生成贡献值或脉冲券。</p><div class="step-list">${[['01','贡献值','后台根据合格 Usage Event 与当期经济规则计算，退款与修正通过新的反向记录处理。'],['02','脉冲券','按当期规则由贡献形成，每张券最多消费一次。券不是可购买、提现或转让的金融资产。'],['03','开启与回馈','每次开启必须使用稳定的动作标识。响应丢失时先查询原动作，不能换一个标识再次开启。'],['04','周期结算','周期为 10 天。已开始周期的核心规则不应原地修改，周期关闭与奖励入账可核对。']].map(([n,t,d])=>`<div><span class="number">${n}</span><section><h3>${t}</h3><p>${d}</p></section></div>`).join('')}</div><h2>内容奖励，是另一条审核路径。</h2><p>内容本身不产生贡献值和脉冲券。只有满足身份、绑定时间、真实付费门槛与内容可见性要求的内容，才可能进入候选，再经过独立预算与人工审核。未绑定、绑定前或绑定同秒的内容不追溯补奖。</p><h2>常见问题</h2>${[['一定要绑定才能使用社区吗？','不需要。社区独立注册、登录、浏览与发帖。绑定只是解锁 Pulse 权益的可选步骤。'],['绑定后能自己解绑或换绑吗？','不能普通自助解绑或静默换绑。纠错必须通过授权支持，在维护窗口处理并保留审计记录。'],['看到“发放中”，可以重新开启吗？','请先查看原动作结果与发放状态。发放中不等于失败，不能用新的 source_ref 重复发放。'],['Pulse 不可用，会影响模型调用吗？','不会进入模型调用、计费、充值或社区本地登录的同步依赖链。原型可以用底部的降级状态验证这一体验。'],['等级越高，管理权限越大吗？','不是。Pulse 等级仅展示，不兑换社区治理角色。社区权限仍由 Answer 管理。']].map(([q,a])=>`<details style="padding:15px 0;border-bottom:1px solid var(--border)"><summary style="cursor:pointer;font-size:13px;font-weight:600">${q}</summary><p style="font-size:12px;color:var(--muted)">${a}</p></details>`).join('')}</section><aside class="stack"><section class="card card-pad"><div class="eyebrow mb16">CYCLE SNAPSHOT · DEMO</div><h3>演示周期参数</h3><dl class="info-pairs"><dt>周期</dt><dd>第 007 期 · 示例</dd><dt>时长</dt><dd>10 天</dd><dt>开始时间</dt><dd>09-01 00:00 +08:00</dd><dt>结束时间</dt><dd>09-11 00:00 +08:00</dd><dt>规则版本</dt><dd>demo-v1</dd><dt>奖励范围</dt><dd>仅示例，不代表实际参数</dd></dl>${link('/pulse','返回我的 Pulse '+I('arrow','sm'),'btn wfull')}</section>${notice('所有数值由后端确定；界面不推算真实预算、不随机决定奖励、不承诺收益率。','info','shield')}</aside></div>${footer()}`}
const statusLabel=s=>({pending:'发放中',settled:'已到账',reversed:'已撤销',review:'待审核',failed:'待对账'}[s]||s);
function rewardTable(list){if(!list.length)return empty('还没有回馈记录','未来的开启结果与内容奖励，会在这里留下可核对的记录。',link('/pulse','返回 Pulse','btn'),'ticket');return `<div class="table-wrap"><table class="data-table"><thead><tr><th>回馈类型 / 记录号</th><th>调用额度 · 示例</th><th>状态</th><th>时间（+08:00）</th><th></th></tr></thead><tbody>${list.map(r=>`<tr><td>${esc(r.title)}<small class="mono">${esc(r.id)}</small></td><td class="mono">${money(r.cents)}</td><td>${badge(statusLabel(r.status),r.status==='settled'?'green':r.status==='pending'?'amber':'')}</td><td class="mono">${esc(r.time)}</td><td>${btn('查看记录 '+I('arrow','sm'),'reward-detail','ghost small',`data-id="${esc(r.id)}"`)}</td></tr>`).join('')}</tbody></table></div>`}
function rewardsPage(){if(!isLogged())return loginRequired('每一份回馈，都可以被核对。','/pulse/rewards');if(!isBound())return `${crumb([['Pulse 权益','/pulse'],['回馈记录']])}${heading('YOUR REWARDS','先连接身份，再查看你的权益。','未绑定账号不展示属于其他身份的奖励记录。')}<section class="card">${empty('你还没有绑定元衡 API 账号','绑定是可选的，不影响社区使用。完成可信身份绑定后，才能查询自己的权益记录。',link('/settings/binding','了解账号绑定','btn primary'),'link')}</section>${footer()}`;const filter=route().query.get('status')||'all';const list=state.rewards.filter(r=>filter==='all'||r.status===filter);return `${crumb([['Pulse 权益','/pulse'],['回馈记录']])}${heading('YOUR REWARD HISTORY','每一份回馈，都可以被核对。','把开启结果、发放状态与撤销记录放在同一条轨迹里。',btn(I('download')+'导出示例记录','export-rewards'))}<div class="pillbar">${[['all','全部'],['pending','发放中'],['settled','已到账'],['reversed','已撤销']].map(([v,t])=>link('/pulse/rewards?status='+v,t,`pill ${filter===v?'active':''}`)).join('')}</div><section class="card">${state.scenario==='degraded'?empty('权益查询暂不可用','当前不展示过期记录，也不把未知状态当作失败。',btn('恢复正常数据演示','scenario-normal','primary'),'server'):rewardTable(state.scenario==='empty'?[]:list)}</section><div class="bulletin mt24">${I('help')}<p>“发放中”表示尚未确认最终结果，不等于失败。正式系统应查询原 Grant / source_ref 并对账；禁止换标识重新发放。</p></div>${footer()}`}
function authPage(mode){const reg=mode==='register',forgot=mode==='forgot';const next=route().query.get('next')||'/discover';return `<div class="auth-layout card"><section class="auth-art"><div><div class="eyebrow" style="color:#aac1a5">A PLACE TO BUILD TOGETHER</div><h2 style="margin-top:24px;font-size:30px;line-height:1.6">好奇心，<br>值得被连接。</h2><p>和认真使用 AI 的人一起，<br>把问题聊透，把经验留下来。</p></div>${heroArt()}<div><div class="flex"><span class="dot"></span><span style="font-size:11px;color:#b7c7ae">社区独立注册 · API 账号可选绑定</span></div></div></section><section class="auth-form"><h1 style="font-size:23px;margin-bottom:8px">${forgot?'找回社区密码':reg?'欢迎加入 METAR':'欢迎回来。'}</h1><p>${forgot?'用社区账号邮箱发起找回流程。':reg?'一个独立社区账号，开启一段新的连接。':'继续你尚未结束的探索。'}</p><form data-form="${forgot?'forgot':reg?'register':'login'}" data-next="${esc(next)}">${reg?'<div class="field"><label for="auth-name">社区昵称</label><input id="auth-name" name="name" placeholder="怎么称呼你？" value="林一" required minlength="2" maxlength="24"></div>':''}<div class="field"><label for="auth-email">社区邮箱</label><input type="email" id="auth-email" name="email" value="demo@example.invalid" placeholder="your@email.com" required autocomplete="off"><small>请勿输入真实凭据。原型不发送邮件，也不保存邮箱与密码。</small></div>${!forgot?`<div class="field"><div class="between"><label for="auth-password">密码</label>${!reg?link('/forgot','忘记密码？','textlink'):''}</div><input id="auth-password" type="password" name="password" placeholder="仅填写演示密码" value="demo-only-123" required minlength="8" autocomplete="off"></div>`:''}${reg?`<label class="checkrow mb16"><input type="checkbox" name="agree" required checked><span>我已阅读${link('/guidelines','社区规范','green')}和${link('/privacy','隐私说明','green')}。</span></label>`:''}<button type="submit" class="btn primary large">${forgot?'演示找回流程':reg?'创建演示社区账号':'使用演示账号登录'} ${I('arrow','sm')}</button></form>${!forgot?`<div class="or">社区身份与 API 身份独立</div>${btn(I('link','sm')+'已绑定账号登录演示','bound-login','wfull')}<p class="muted mt8" style="font-size:10px;line-height:1.8">仅适用于已完成绑定的身份。不会按相同邮箱自动合并账号。</p><div style="text-align:center;font-size:12px;margin-top:24px">${reg?'已有社区账号？ '+link('/login','去登录','textlink'):'还没有账号？ '+link('/register','独立注册','textlink')}</div>`:`<div style="text-align:center;margin-top:24px">${link('/login','返回登录','textlink')}</div>`}</section></div>${footer()}`}

function settingsLayout(title,description,content){return `${crumb([['个人设置']])}${heading('YOUR ACCOUNT',title,description)}<div class="settings-layout"><nav class="card settings-nav" aria-label="个人设置">${SETTINGS_NAV.map(([u,t,i])=>link(u,I(i)+t,`nav-item ${route().path===u?'active':''}`)).join('')}</nav><section class="card">${content}</section></div>${footer()}`}
function settingsPage(type){if(!isLogged())return loginRequired('管理你的社区账号。');if(type==='binding')return bindingPage();if(type==='notifications')return settingsLayout('重要的消息，刚好到达。','控制社区消息偏好，不改变服务端必须发送的安全通知。',`<form data-form="notification-settings"><div class="settings-section"><h3>消息与订阅</h3><p>演示设置仅保存在当前浏览器，不会发送订阅请求。</p>${[['replies','回答与提及','有人回复你的问题或提及你时通知。'],['digest','社区精选周报','收到知识库与关注话题的内容摘要。'],['system','站内运营通知','社区公告与已参与内容的审核进度。']].map(([k,t,d])=>`<label class="setting-row"><span><strong style="font-size:13px">${t}</strong><p>${d}</p></span><input class="toggle" type="checkbox" name="${k}" aria-label="${t}" ${state.settings[k]?'checked':''}></label>`).join('')}<div class="bulletin mt16">${I('shield')}<p>账号安全与绑定变更类通知不提供关闭入口。</p></div><div class="mt24"><button type="submit" class="btn primary">保存消息偏好</button></div></div></form>`);
if(type==='security')return settingsLayout('让你的社区身份，始终可控。','社区密码与会话由 Answer 管理，与 new-api 的登录相互独立。',`<div class="settings-section"><h3>登录与密码</h3><div class="setting-row"><div><strong style="font-size:13px">社区登录密码</strong><p>仅用于社区本地登录，不是元衡 API 密码。</p></div>${btn('修改密码','password-demo')}</div><div class="setting-row"><div><strong style="font-size:13px">登录会话</strong><p>此浏览器 · 当前演示会话（非真实会话列表）</p></div>${badge('演示中','green')}</div><div class="setting-row"><div><strong style="font-size:13px">退出当前演示身份</strong><p>保留本地演示数据，但切换为访客视图。</p></div>${btn(I('logout','sm')+'退出','logout')}</div></div><div class="settings-section"><h3>账号与数据请求</h3><p>账号注销、绑定纠错与数据请求通过支持工单处理，不静默转移身份。</p>${link('/support?type=account','联系账号支持 '+I('arrow','sm'),'btn')}</div>`);
return settingsLayout('让大家更好地认识你。','资料属于社区账号，不由 API 付费等级覆盖。',`<form data-form="profile"><div class="settings-section"><div class="flex mb16"><span class="avatar a4 large">${esc(state.profile.name.slice(0,1))}</span><div><h3>${esc(state.profile.name)}</h3><p class="muted mt8" style="font-size:11px">原型使用文字头像。正式头像接入 Answer 的上传与校验。</p></div></div><div class="form-grid"><div class="field"><label for="profile-name">社区昵称</label><input id="profile-name" name="name" required minlength="2" maxlength="24" value="${esc(state.profile.name)}"></div><div class="field"><label>社区邮箱</label><input value="demo@example.invalid" disabled aria-label="演示社区邮箱"><small>邮箱修改与验证需对接 Answer。</small></div></div><div class="field"><label for="profile-bio">个人简介</label><textarea id="profile-bio" name="bio" rows="3" maxlength="180">${esc(state.profile.bio)}</textarea></div><div class="form-grid"><div class="field"><label for="profile-location">地区（选填）</label><input id="profile-location" name="location" value="${esc(state.profile.location)}" maxlength="40" placeholder="让相同地区的创作者认识你"></div><div class="field"><label for="profile-website">个人网站（选填）</label><input id="profile-website" name="website" value="${esc(state.profile.website)}" type="url" placeholder="https://example.com"></div></div><button type="submit" class="btn primary">保存资料</button></div></form>`)}
function bindingPage(){const bound=isBound(),conflict=route().query.get('case')==='conflict';return settingsLayout('连接身份，但不混淆身份。','社区独立存在。只有你主动选择，才连接元衡 API 权益。',`<div class="settings-section"><div class="between"><h3>元衡 API 账号</h3>${badge(bound?'已绑定':'未绑定',bound?'green':'')}</div><p>绑定用于识别你的 Pulse 等级和权益，不授予社区管理权限。</p>${conflict?notice('该 API 身份已绑定其他社区账号，不能继续。请登录原社区账号，或通过支持工单核对；不覆盖已有绑定。','error','shield'):''}${bound?`<div class="bound-account"><div class="topic-icon" style="margin:0">${I('link')}</div><div><strong>yh_demo_042</strong><p class="muted" style="font-size:11px;margin-top:4px">经授权确认的 API 身份 · 本地演示</p></div>${badge(I('check','sm')+' 一对一绑定','green')}</div><dl class="info-pairs"><dt>社区账号</dt><dd>${esc(state.profile.name)}</dd><dt>API 身份</dt><dd class="mono">yh_demo_042（示例）</dd><dt>绑定方式</dt><dd>可信回调确认 · 演示</dd><dt>普通解绑 / 换绑</dt><dd>不开放。纠错需授权支持并审计。</dd></dl><div class="flex wrap">${link('/pulse','查看 Pulse 权益 '+I('arrow','sm'),'btn primary')}${link('/support?type=binding','申请绑定纠错','btn')}</div>`:`<div class="binding-steps">${[['1','确认社区身份','当前登录：'+esc(state.profile.name)],['2','前往 API 授权','由可信跳转链路确认 API 身份'],['3','确认一对一绑定','完成后不能普通自助换绑']].map(([n,t,d])=>`<div class="binding-step"><span class="number">${n}</span><section><strong>${t}</strong><p>${d}</p></section></div>`).join('')}</div><label class="checkrow mb16"><input id="binding-consent" type="checkbox" ${conflict?'disabled':''}><span>我理解绑定是可选的一对一关系，不能普通自助解绑或换绑；不会按同名邮箱自动合并身份。</span></label><div class="flex wrap">${btn(I('link')+'开始绑定演示','bind-start','primary',conflict?'disabled':'')}${link('/discover','暂不绑定，返回社区','btn ghost')}</div><div class="mt16">${link(conflict?'/settings/binding':'/settings/binding?case=conflict',conflict?'恢复正常绑定视图':'查看绑定冲突示例','textlink')}</div>`}</div><div class="settings-section"><h3>这次连接，不会做什么？</h3><p>不会读取或展示 API Key，不会合并两个密码，不会把 API 余额复制为社区余额，也不会自动补发绑定前的内容奖励。</p>${notice('正式接入必须经过 Answer Connector → new-api 同源 bootstrap → 固定 callback。浏览器不提交可信 user_id，不能用前端配置代替身份验签。','info','shield')}</div>`)}
function profilePage(name=null){const own=!name||name===state.profile.name;if(own&&!isLogged())return loginRequired('你的社区轨迹。','/me');const title=own?state.profile.name:name;const posts=own?state.posts:SEED_POSTS.filter(p=>p.author===name);const tab=route().query.get('tab')||'posts';return `${crumb([['成员主页']])}<div class="content-grid"><div><section class="card"><div class="profile-banner"></div><div class="profile-info"><div class="between"><span class="avatar a4 large">${esc(title.slice(0,1))}</span>${own?link('/settings/account',I('edit','sm')+'编辑资料','btn small'):btn(I('plus','sm')+'关注成员','follow-person','small',`data-name="${esc(title)}"`)}</div><div class="flex wrap mt8"><h1>${esc(title)}</h1>${own&&isBound()&&state.scenario!=='degraded'?badge('Pulse L3 · 仅展示','green'):badge('社区成员')}</div><p>${own?esc(state.profile.bio):'认真提问，分享实践。此成员资料是交互原型示例。'}</p><div class="profile-numbers"><div><strong>${posts.length}</strong><span>发布内容</span></div><div><strong>${own?Object.values(state.answers).reduce((n,x)=>n+x.length,0):12}</strong><span>参与回答</span></div><div><strong>${own?state.follows.length:3}</strong><span>关注话题</span></div></div></div></section><section class="card mt24">${tabs(own?'/me':'/profile/'+encodeURIComponent(title),tab,[['posts','发布的内容'],['answers','参与回答'],['following','关注话题']])}${tab==='following'?`<div class="card-pad"><div class="flex wrap">${TOPICS.filter(t=>!own||state.follows.includes(t.id)).map(t=>link('/topic/'+t.id,I(t.icon,'sm')+' '+t.name,'btn')).join('')||'暂未关注话题'}</div></div>`:tab==='answers'?(own?Object.entries(state.answers).filter(([k,v])=>v.length).map(([id,ans])=>`<div class="result-row">${link('/question/'+id,'<h3>'+esc(getPost(id)?.title||'讨论')+'</h3>')}<p>${esc(ans.at(-1).body)}</p></div>`).join('')||empty('还没有回答记录','从你熟悉的话题开始，给一个具体的建议。',link('/questions?tab=unanswered','寻找待回答的问题','btn'),'chat'):postRows(SEED_POSTS.slice(1,3))):postRows(posts)}</section></div><aside class="stack"><section class="card card-pad"><h3>${own?'你的快捷入口':'社区连接'}</h3><div class="mini-list"><li>${link('/bookmarks',I('bookmark','sm')+' 我的收藏')}</li><li>${link('/drafts',I('file','sm')+' 草稿箱')}</li><li>${link('/settings/binding',I('link','sm')+' API 账号绑定')}</li><li>${link('/notifications',I('bell','sm')+' 通知中心')}</li></div></section></aside></div>${footer()}`}
function bookmarksPage(){if(!isLogged())return loginRequired('值得再看一次的内容。','/bookmarks');const ids=state.bookmarks;const ps=allPosts().filter(p=>ids.includes(p.id));const ars=ARTICLES.filter(a=>ids.includes('article-'+a.id));return `${crumb([['我的收藏']])}${heading('SAVED FOR LATER','值得再看一次的内容。','把当下的灵感留下来，在需要的时候找到它。')}<section class="card">${state.scenario==='empty'||(!ps.length&&!ars.length)?empty('还没有收藏内容','在问题或文章详情中选择收藏，就能在这里重新找到。',link('/discover','探索社区','btn primary'),'bookmark'):(ps.length?postRows(ps):'')+ars.map(a=>`<div class="result-row">${badge(a.category)}${link('/article/'+a.id,'<h3>'+a.title+'</h3>')}${btn('取消收藏','bookmark-article','ghost small',`data-id="${a.id}"`)}</div>`).join('')}</section>${footer()}`}
function draftsPage(){if(!isLogged())return loginRequired('留给下一次灵感。','/drafts');const ds=state.scenario==='empty'?[]:state.drafts;return `${crumb([['内容草稿']])}${heading('WORK IN PROGRESS','还没说完的，先替你留着。','草稿只保存在当前浏览器。正式版本需对接社区草稿或专属存储。',link('/publish',I('plus')+'新建内容','btn primary'))}<section class="card">${ds.length?ds.map(d=>`<div class="result-row"><div class="between"><div>${badge(d.kind==='article'?'知识库投稿':'社区内容')}<h3>${link('/publish?draft='+d.id,esc(d.title||'未命名草稿'))}</h3><p>${esc(d.body.slice(0,90)||'还没有正文')}</p><small class="muted">本地保存 · ${esc(d.time)}</small></div><div class="flex">${link('/publish?draft='+d.id,'继续编辑','btn small')}${btn('删除','delete-draft','ghost small',`data-id="${d.id}"`)}</div></div></div>`).join(''):empty('这里等着你的下一个想法','在编辑器中选择“保存草稿”，就能在这里继续创作。',link('/publish','开始创作','btn primary'),'edit')}</section>${footer()}`}

function handleForm(form,event){const type=form.dataset.form,fd=new FormData(form);if(!form.checkValidity()){form.reportValidity();return}const val=n=>String(fd.get(n)||'').trim();switch(type){
 case 'search':to('/search?q='+encodeURIComponent(val('q')));break;

 case 'answer':if(!requireMember())return;{const id=form.dataset.id;if(!getPost(id))return;state.answers[id]=state.answers[id]||[];state.answers[id].push({id:uid('answer'),author:state.profile.name,body:val('answer'),time:new Date().toISOString()});save();render();$('#answer-form')?.scrollIntoView({behavior:'smooth',block:'center'});toast('回答已保存到原型本地，不产生 Pulse 权益');break}
 case 'publish':if(!requireMember('/publish'))return;{const id=uid('local'),body=val('body'),kind=val('kind'),tags=val('tags').split(/[,，]/).map(x=>x.trim()).filter(Boolean).slice(0,3);const topic=getTopic(val('topic'))?val('topic'):'dev';state.posts.unshift({id,authorId:'demo-community-user',title:val('title'),body,excerpt:body.slice(0,140),author:state.profile.name,initial:state.profile.name.slice(0,1),avatar:4,topic,tags:tags.length?tags:[getTopic(topic).tags[0]],votes:0,answers:0,views:0,time:'刚刚 · 本地示例',solved:false,status:'pending',kind});if(form.dataset.draft)state.drafts=state.drafts.filter(d=>d.id!==form.dataset.draft);audit('提交本地内容',kind==='article'?'知识库投稿待审核；不直接发布长文':'社区内容待审核');save();to('/question/'+id);toast('已在本地提交，等待审核；没有发布到线上');break}

 case 'support':{const id=uid('ticket');state.support.unshift({id,type:val('type'),title:val('title'),body:val('body'),ref:val('ref'),status:'pending'});audit('提交演示工单',id+' · '+val('type'));save();form.reset();openModal('演示工单已记录',`<div class="dialog-success">${I('check')}</div><p>没有发送到真实支持系统。你可以在此浏览器的帮助中心，或演示管理员的工单页面查看它。</p><div class="code">${id}</div><div class="actions">${btn('查看记录','support-detail','primary',`data-id="${id}"`)}${btn('关闭','close-modal')}</div>`);break}
 case 'report':{const id=uid('report');state.support.unshift({id,type:'内容举报',title:val('reason'),body:val('detail'),ref:form.dataset.id,status:'pending'});audit('提交本地举报',form.dataset.id+' · '+val('reason'));save();closeModal();toast('举报已保存在演示工单中，未发送到线上');break}
 case 'review-post':if(!requireAdmin())return;{const p=state.posts.find(x=>x.id===form.dataset.id);if(!p||p.status!=='pending')return;const decision=event.submitter?.value||'rejected';p.status=decision==='approved'?(p.kind==='article'?'editorial':'approved'):'rejected';audit('本地内容审核',p.id+' · '+p.status+' · '+val('reason'));save();closeModal();render();toast(p.kind==='article'&&p.status==='editorial'?'投稿审核已通过，待编辑发布；未写入 VitePress':'本地内容状态已更新，未发放任何奖励');break}
 case 'candidate':if(!requireAdmin())return;{const id=form.dataset.id,c=CANDIDATES.find(x=>x.id===id);if(!c?.eligible||state.moderation[id]){toast('该候选不可重复处理');return}const decision=event.submitter?.value||'rejected';if(decision==='awarded'&&!fd.has('budget')){toast('请先确认独立预算演示说明');return}state.moderation[id]=decision;if(decision==='awarded'){state.rewards.unshift({id:'demo-content-'+id,title:'内容奖励 · '+c.title,cents:50,status:'pending',time:'刚刚',kind:'content',actionId:'content_award:demo:'+id+':1'})}audit('独立内容奖励审核',id+' · '+decision+' · '+val('reason'));save();closeModal();render();toast('演示审核已记录，贡献值和脉冲券不变');break}
 case 'period':if(!requireAdmin())return;state.nextPeriod={title:val('title'),note:val('note'),status:'draft'};audit('下一期草案',val('title')+' · 当前 Active 周期未改变');save();closeModal();render();toast('已保存本地草案，当前周期规则保持不变');break;
 case 'rollback':if(!requireAdmin())return;{const r=state.rewards.find(x=>x.id===form.dataset.id);if(!r||r.status!=='settled')return;state.reversals=state.reversals||[];state.reversals.push({id:uid('reversal'),originalGrantId:r.id,cents:-r.cents,reason:val('reason')});r.status='reversed';audit('演示撤销原 Grant',r.id+' · '+val('reason')+'；原金额不变，追加反向记录');save();closeModal();render();toast('已演示追加反向记录，未改写原金额');break}
 default:console.warn('Unknown form',type);toast('该表单尚未配置');
}}
document.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el){event.preventDefault();handleAction(el).catch(e=>{console.error('Prototype action error',e);toast('本地操作未完成，可尝试重置原型')});return}if(event.target.matches('[data-overlay]')){closeModal();return}const a=event.target.closest('a');if(a?.getAttribute('href')?.startsWith('#/')){closeModal();document.body.classList.remove('menu-open')}});
document.addEventListener('submit',event=>{const form=event.target.closest('form[data-form]');if(!form)return;event.preventDefault();try{handleForm(form,event)}catch(e){console.error('Prototype form error',e);toast('表单操作未完成，没有发送外部请求')}});
document.addEventListener('change',event=>{const change=event.target.dataset.change;if(change==='role'){state.role=event.target.value;save();closeModal();render();toast('演示身份已切换，不代表真实授权')}if(change==='scenario'){state.scenario=event.target.value;save();closeModal();render();toast('已切换界面数据状态')}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeModal();document.body.classList.remove('menu-open')}if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();$('.searchbox input')?.focus()}if(event.key==='Tab'&&$('.modal')){const elements=Array.from($('.modal').querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')).filter(x=>x.getClientRects().length);if(!elements.length)return;const first=elements[0],last=elements.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{closeModal();render();window.scrollTo({top:0,behavior:'instant'});$('#main')?.focus({preventScroll:true})});
render();
</script>
</body>
</html>
